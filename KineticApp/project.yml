# Generate Kinetic.xcodeproj with XcodeGen:  brew install xcodegen && xcodegen
name: Kinetic
options:
  bundleIdPrefix: com.example.kinetic
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true

packages:
  KineticCore:
    path: Packages/KineticCore

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Set your Apple Developer team ID here (or in Xcode → Signing & Capabilities).
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  Kinetic:
    type: application
    platform: iOS
    sources:
      - iOSApp
      - Shared
    dependencies:
      - package: KineticCore
      - target: KineticWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.kinetic
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: iOSApp/Info.plist
      properties:
        CFBundleDisplayName: Kinetic
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSHealthShareUsageDescription: Kinetic reads heart rate, HRV, sleep and steps to calculate your Charge, Load and Movement scores.
        NSHealthUpdateUsageDescription: Kinetic saves the sessions you track on Apple Watch to Health.
    entitlements:
      path: iOSApp/Kinetic.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []

  KineticWatch:
    type: application
    platform: watchOS
    sources:
      - WatchApp
      - Shared
    dependencies:
      - package: KineticCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.kinetic.watchkitapp
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES
    info:
      path: WatchApp/Info.plist
      properties:
        CFBundleDisplayName: Kinetic
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.example.kinetic
        WKBackgroundModes: [workout-processing]
        NSHealthShareUsageDescription: Kinetic reads heart rate, HRV, sleep and steps to calculate your Charge, Load and Movement scores.
        NSHealthUpdateUsageDescription: Kinetic saves the sessions you track to Health.
        NSMotionUsageDescription: Kinetic uses motion data to measure how intensely you're moving during a session.
    entitlements:
      path: WatchApp/KineticWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []

schemes:
  Kinetic:
    build:
      targets:
        Kinetic: all
        KineticWatch: all
  KineticWatch:
    build:
      targets:
        KineticWatch: all
